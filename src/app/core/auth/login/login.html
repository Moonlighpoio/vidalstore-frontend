<div class="login-container">
  <h2>Iniciar Sesión</h2>
  
  <form (ngSubmit)="loginConPassword()">
    <div class="form-group">
      <label for="email">Email</label>
      <input 
        type="email" 
        id="email" 
        [(ngModel)]="email" 
        name="email" 
        required
        placeholder="tu@email.com"
      />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input 
        type="password" 
        id="password" 
        [(ngModel)]="password" 
        name="password" 
        required
        placeholder="••••••••"
      />
    </div>

    <button type="submit" class="btn-primary">
      Iniciar Sesión
    </button>
  </form>

  <div class="divider">
    <span>o</span>
  </div>

  <button (click)="onSubmit()" class="btn-secondary">
    Iniciar con AWS Cognito
  </button>

  <div class="register-link">
    <p>
      ¿No tienes cuenta? 
      <a routerLink="/registro">Regístrate aquí</a>
    </p>
  </div>
</div>
