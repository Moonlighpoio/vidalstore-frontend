<section class="login-container" aria-live="polite">
  <div class="login-card">
    <h1>Redirigiendo a VidalStore</h1>

    @if (!errorMessage) {
      <p>Serás redirigido al inicio de sesión seguro de Cognito.</p>
      <p>Espera un momento...</p>
    } @else {
      <p class="error-message">{{ errorMessage }}</p>

      <button type="button" (click)="ngOnInit()">
        Reintentar redirección
      </button>
    }
  </div>
</section>
