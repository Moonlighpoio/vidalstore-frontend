<div class="login-container">
  <h2>Iniciar Sesión</h2>

  <div *ngIf="errorMessage" class="alert alert-error">
    {{ errorMessage }}
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" formControlName="email" placeholder="usuario@correo.com" />
      <small *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']" class="error-text">
        El correo es requerido.
      </small>
      <small *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']" class="error-text">
        Ingresa un correo electrónico válido.
      </small>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" placeholder="Ingresa tu contraseña" />
      <small *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']" class="error-text">
        La contraseña es requerida.
      </small>
    </div>

    <button type="submit" [disabled]="loading || loginForm.invalid">
      {{ loading ? 'Iniciando sesión...' : 'Ingresar' }}
    </button>
  </form>

  <p class="register-link">
    ¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a>
  </p>
</div>
